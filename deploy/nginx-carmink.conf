# /etc/nginx/sites-available/carmink  (then: ln -s into sites-enabled, nginx -t, systemctl reload nginx)
# Run `sudo certbot --nginx -d carmink.suketchi.art` afterwards: it adds the HTTPS server block.
server {
    listen 80;
    listen [::]:80;
    server_name carmink.suketchi.art;

    client_max_body_size 1m;            # canvas pictures are ~50 KB

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
